AWSTemplateFormatVersion: '2010-09-09'
Description: 'CI/CD Pipeline for Bedrock Video Analyzer'

Parameters:
  GitHubOwner:
    Type: String
    Description: 'GitHub repository owner'
    Default: 'your-github-username'
  
  GitHubRepo:
    Type: String
    Description: 'GitHub repository name'
    Default: 'bedrock-video-analyzer'
    
  GitHubBranch:
    Type: String
    Description: 'GitHub branch to track'
    Default: 'main'
    
  GitHubToken:
    Type: String
    Description: 'GitHub personal access token'
    NoEcho: true

Resources:
  # S3 Bucket for CodePipeline artifacts
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'codepipeline-artifacts-${AWS::AccountId}-${AWS::Region}'
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # CodeBuild Service Role
  CodeBuildServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodeBuildPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub '${ArtifactsBucket}/*'
              - Effect: Allow
                Action:
                  - cloudformation:*
                  - iam:*
                  - lambda:*
                  - apigateway:*
                  - dynamodb:*
                  - s3:*
                Resource: '*'

  # CodePipeline Service Role
  CodePipelineServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CodePipelinePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:GetBucketVersioning
                Resource:
                  - !Sub '${ArtifactsBucket}/*'
                  - !Ref ArtifactsBucket
              - Effect: Allow
                Action:
                  - codebuild:BatchGetBuilds
                  - codebuild:StartBuild
                Resource: !GetAtt CodeBuildProject.Arn

  # CodeBuild Project
  CodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: bedrock-video-analyzer-build
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        EnvironmentVariables:
          - Name: AWS_DEFAULT_REGION
            Value: !Ref AWS::Region
          - Name: AWS_ACCOUNT_ID
            Value: !Ref AWS::AccountId
      Source:
        Type: CODEPIPELINE
        BuildSpec: |
          version: 0.2
          phases:
            install:
              runtime-versions:
                nodejs: 18
            pre_build:
              commands:
                - echo Logging in to Amazon ECR...
                - echo Build started on `date`
                - npm install
                - cd lambda && npm install && cd ..
            build:
              commands:
                - echo Build phase started on `date`
                - npm test
                - cd lambda && npm run build && cd ..
                - echo Validating CloudFormation template...
                - aws cloudformation validate-template --template-body file://fixed-cloudformation.yaml
            post_build:
              commands:
                - echo Build completed on `date`
                - echo Deploying CloudFormation stack...
                - |
                  STACK_NAME="bedrock-video-analyzer-dev"
                  if aws cloudformation describe-stacks --stack-name $STACK_NAME 2>/dev/null; then
                    echo "Updating existing stack..."
                    aws cloudformation update-stack \
                      --stack-name $STACK_NAME \
                      --template-body file://fixed-cloudformation.yaml \
                      --capabilities CAPABILITY_NAMED_IAM \
                      --parameters ParameterKey=Environment,ParameterValue=dev
                    aws cloudformation wait stack-update-complete --stack-name $STACK_NAME
                  else
                    echo "Creating new stack..."
                    aws cloudformation create-stack \
                      --stack-name $STACK_NAME \
                      --template-body file://fixed-cloudformation.yaml \
                      --capabilities CAPABILITY_NAMED_IAM \
                      --parameters ParameterKey=Environment,ParameterValue=dev
                    aws cloudformation wait stack-create-complete --stack-name $STACK_NAME
                  fi
                - echo Getting stack outputs...
                - aws cloudformation describe-stacks --stack-name $STACK_NAME --query "Stacks[0].Outputs" --output table

  # CodePipeline
  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: bedrock-video-analyzer-pipeline
      RoleArn: !GetAtt CodePipelineServiceRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactsBucket
      Stages:
        - Name: Source
          Actions:
            - Name: SourceAction
              ActionTypeId:
                Category: Source
                Owner: ThirdParty
                Provider: GitHub
                Version: '1'
              Configuration:
                Owner: !Ref GitHubOwner
                Repo: !Ref GitHubRepo
                Branch: !Ref GitHubBranch
                OAuthToken: !Ref GitHubToken
              OutputArtifacts:
                - Name: SourceOutput
        - Name: Build
          Actions:
            - Name: BuildAction
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref CodeBuildProject
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: BuildOutput

Outputs:
  PipelineName:
    Description: 'Name of the CodePipeline'
    Value: !Ref Pipeline
    
  ArtifactsBucket:
    Description: 'S3 bucket for pipeline artifacts'
    Value: !Ref ArtifactsBucket
    
  CodeBuildProject:
    Description: 'CodeBuild project name'
    Value: !Ref CodeBuildProject